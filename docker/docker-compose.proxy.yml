volumes:
  caddy_data:
    name: capacitor-socket-io_caddy_data

services:
  socketio:
    build:
      context: ./socket-server
    environment:
      SOCKET_SERVER_PORT: 4000
      SOCKET_SERVER_PATH: /socket.io
    ports:
      - "4000:4000"
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - socketio
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy-ui:/srv:ro
      - caddy_data:/data
    environment:
      SOCKET_PROXY_HOST: ${SOCKET_PROXY_HOST:-socket-proxy.local}
      TLS_EMAIL: ${TLS_EMAIL:-}
    ports:
      - "${SOCKET_PROXY_PORT:-443}:443"
      - "80:80"
    restart: unless-stopped
